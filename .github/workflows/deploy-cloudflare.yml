name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Assemble static site
        env:
          # Cloudflare Pages serves the site at the root, unlike GitHub Pages'
          # /<repo>/ subpath, so the OG share stubs need this origin explicitly.
          SITE_BASE_URL: https://anime-sub-thai.pages.dev/
        run: bash tools/build-site.sh
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@4 pages deploy _site --project-name anime-sub-thai --branch main
