<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ไม่พบหน้านี้ — Anime TV Catalog</title>
  <meta name="robots" content="noindex" />
  <!-- Cloudflare Pages serves this file with a real 404 status for unmatched
       paths; without it Pages falls back to index.html with a 200, which turns
       every typo'd share link into a soft 404. Styles are inlined because the
       deployed styles.css is referenced by a content-hashed URL that only
       index.html carries. -->
  <style>
    :root { color-scheme: light dark; --bg:#f5f5f7; --text:#1d1d1f; --muted:#6e6e73; }
    @media (prefers-color-scheme: dark) { :root { --bg:#000; --text:#f5f5f7; --muted:#98989d; } }
    body { margin:0; min-height:100dvh; display:grid; place-content:center; gap:.75rem; text-align:center; padding:2rem;
           background:var(--bg); color:var(--text);
           font-family:"IBM Plex Sans Thai",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    h1 { margin:0; font-size:3rem; letter-spacing:-.02em; }
    p { margin:0; color:var(--muted); }
    a { display:inline-block; margin-top:1rem; padding:.65rem 1.4rem; border-radius:999px;
        background:var(--text); color:var(--bg); text-decoration:none; font-weight:600; }
  </style>
</head>
<body>
  <h1>404</h1>
  <p>ไม่พบหน้าที่คุณกำลังมองหา</p>
  <a href="/">กลับหน้าแรก</a>
</body>
</html>
